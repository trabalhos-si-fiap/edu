[project]
name = "auth-users-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "edu-common",
    "fastapi>=0.115.0",
    "granian>=1.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic[email]>=2.10.0",
    "pydantic-settings>=2.6.0",
    "aio-pika>=9.4.2",
    "loguru>=0.7.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "httpx>=0.28.0",
]

[tool.uv.sources]
edu-common = { path = "../packages/edu-common", editable = true }

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ASYNC"]
"alembic/**" = ["S", "E501"]

# `Depends(...)` como default de argumento é o idioma do FastAPI, não o
# bug que o B008 procura. Declarar aqui evita espalhar `# noqa: B008`
# por todo router dos sete serviços. `requer_papel` entra na lista pelo
# mesmo motivo: `Depends(requer_papel("admin"))` é chamada inline por
# design, e sem isso todo endpoint com papel exigido carregaria um noqa.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Security",
    "app.dependencies.requer_papel",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
# Sem isso, cada teste roda num event loop novo (padrão "function") enquanto
# `test_engine` (Recipe C, scope="session") e seu pool asyncpg nascem presos
# ao loop do primeiro teste — o segundo teste que toca o banco quebra com
# "Future ... attached to a different loop". Loop também "session" alinha a
# vida do loop com a do engine.
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: tests that load a real embeddings model (opt-in)",
]

[tool.coverage.run]
source = ["app"]
omit = ["alembic/*"]
