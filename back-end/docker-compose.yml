# Stack completo do backend: infra compartilhada + os 7 serviços novos
# (gateway + seis serviços de domínio).
#
# Até a spec A (2026-09-07) este arquivo era um SUPERCONJUNTO ESTRITO de
# `legacy/docker-compose.yml`: mesmo COMPOSE_PROJECT_NAME (do .env), mesmos
# nomes de volume e mesmos container_name, para que `make stack-up`
# reaproveitasse o volume de Postgres que o legacy já usava, em vez de criar
# um segundo. A spec A apagou `back-end/legacy/` e o compose que vinha com
# ele; os nomes de volume/projeto ficaram como estavam, sem motivo para mudar.
#
# O `.env` é único e fica ao lado deste arquivo, em `back-end/.env`. Aqui
# `env_file: - .env` e a interpolação de ${VAR} apontam ambos para ele sem
# nenhum flag extra, porque o project directory é esta pasta.
#
# Portas host: gateway em ${GATEWAY_PORT_EXTERNAL} (8100 nesta máquina) e os
# seis serviços em 8101-8106. A faixa 80xx tem outros projetos nesta máquina
# (8000 é de um deles) — nenhum é afetado por este arquivo.

# Bloco comum aos serviços novos. RABBITMQ_URL e as DATABASE_URL* são montadas
# por interpolação para não hardcodar senha neste arquivo. Cada serviço
# sobrescreve DATABASE_URL/DATABASE_URL_TEST com o SEU banco — sem isso o
# valor do banco `edu` (órfão, herdado do legacy) vaza do .env compartilhado
# para dentro do container.
x-service-env: &service-env
  RABBITMQ_URL: amqp://${RABBITMQ_USER:-edu}:${RABBITMQ_PASSWORD:-edu}@rabbitmq:5672/
  EXCHANGE_NAME: ${EXCHANGE_NAME:-edu.events}
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET não definido em back-end/.env}
  JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}

x-depends-db-mq: &depends-db-mq
  postgres:
    condition: service_healthy
  rabbitmq:
    condition: service_healthy

services:
  # ── Infra compartilhada ────────────────────────────────────────────────
  postgres:
    container_name: edu-postgres
    image: postgres:17.4-alpine3.21
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT_EXTERNAL:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/
      # Os dois initdb.d montados script a script: não dá para montar duas
      # pastas no mesmo destino. O prefixo numérico define a ordem.
      #
      # ATENÇÃO: por ser script a script e não pasta inteira, um arquivo novo
      # em `./postgres/initdb.d/` NÃO passa a rodar sozinho — ele vira um
      # no-op silencioso até que a linha de mount dele seja acrescentada aqui.
      - ./postgres/initdb.d/00-init_test_db.sh:/docker-entrypoint-initdb.d/00-init_test_db.sh:ro
      - ./postgres/initdb.d/10-create-service-databases.sh:/docker-entrypoint-initdb.d/10-create-service-databases.sh:ro
    env_file:
      - .env
    command: postgres -c max_connections=200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.2.1-alpine
    container_name: ${COMPOSE_PROJECT_NAME}-redis
    ports:
      - "${REDIS_PORT_EXTERNAL:-6379}:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4.2.3-management-alpine
    container_name: ${COMPOSE_PROJECT_NAME}-rabbitmq
    restart: unless-stopped
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "${RABBITMQ_PORT_EXTERNAL:-5672}:5672"         # Porta do protocolo AMQP
      - "${RABBITMQ_UI_PORT_EXTERNAL:-15672}:15672"   # Painel de Controle
    env_file:
      - .env
    environment:
      # The image reads RABBITMQ_DEFAULT_USER/PASS (not RABBITMQ_USER/PASSWORD),
      # so map the project vars onto the names it expects. Only applied when the
      # data volume is first initialised — see start-here docs to reset.
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-edu}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-edu}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: edu
      MINIO_ROOT_PASSWORD: edu-secret
    ports:
      # Parametrizadas como todas as outras: 9000/9001 são portas muito
      # disputadas, e numa máquina que já tenha outro MinIO (ou qualquer
      # coisa em 9000) o stack não subia sem editar este arquivo.
      - "${MINIO_PORT_EXTERNAL:-9000}:9000"
      - "${MINIO_CONSOLE_PORT_EXTERNAL:-9001}:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 edu edu-secret; do echo waiting for minio; sleep 1; done;
      mc mb --ignore-existing local/edu-media;
      mc anonymous set none local/edu-media;
      echo bucket-ready;
      exit 0;
      "

  # ── Gateway + 6 serviços ────────────────────────────────────────────────
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${GATEWAY_PORT_EXTERNAL:-8100}:8000"
    environment:
      # O .env compartilhado herdou do legacy um DATABASE_URL apontando para o
      # banco `edu` (órfão desde a spec A — nenhum serviço novo o usa). O
      # gateway não tem banco: zerar evita que essa credencial fique no
      # ambiente de um container que não deveria alcançá-la.
      DATABASE_URL: ""
      DATABASE_URL_TEST: ""
      # As URLs internas usam o hostname do compose e a porta 8000 INTERNA do
      # container, que não muda — o mapeamento 810x:8000 só vale de fora.
      AUTH_SERVICE_URL: http://auth-users-service:8000
      LEARNING_SERVICE_URL: http://learning-service:8000
      COMMERCE_SERVICE_URL: http://commerce-service:8000
      NOTIFICATION_SERVICE_URL: http://notification-service:8000
      ANALYTICS_SERVICE_URL: http://analytics-service:8000
      CHATBOT_SERVICE_URL: http://chatbot-service:8000
    depends_on:
      - auth-users-service
      - learning-service
      - commerce-service
      - chatbot-service
      - notification-service
      - analytics-service

  auth-users-service:
    build:
      context: .
      dockerfile: auth-users-service/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8101:8000"
    environment:
      <<: *service-env
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/auth_db
      DATABASE_URL_TEST: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/auth_test
    depends_on: *depends-db-mq

  learning-service:
    build:
      context: .
      dockerfile: learning-service/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8102:8000"
    environment:
      <<: *service-env
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/learning_db
      DATABASE_URL_TEST: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/learning_test
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    depends_on: *depends-db-mq

  commerce-service:
    build:
      context: .
      dockerfile: commerce-service/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8103:8000"
    environment:
      <<: *service-env
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/commerce_db
      DATABASE_URL_TEST: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/commerce_test
      # O .env herdou do legacy o nome GOOGLE_MAPS_API_PLATAFORM para a chave
      # do Maps; o commerce-service lê GOOGLE_MAPS_API_KEY. Ligar as duas
      # evita ter a mesma chave duas vezes no .env. `app/services/rastreio.py`
      # usa este campo para chamar a Directions API em `GET /orders/{id}/route`.
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_PLATAFORM:-}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      REDIS_URL_TEST: redis://:${REDIS_PASSWORD}@redis:6379/14
      R2_ENDPOINT_URL: http://minio:9000
      # Assina a URL presignada contra o IP LAN do host, para o aparelho
      # físico alcançar o MinIO.
      R2_PUBLIC_ENDPOINT_URL: "http://${HOST_IP:-10.0.2.2}:9000"
      # Chamada serviço-a-serviço para app/services/auth_client.py (nome do
      # autor da review, hoje; endereço de entrega, a partir do bloco C).
      AUTH_SERVICE_URL: http://auth-users-service:8000
      # Rede de segurança da apresentação (app/scheduler.py, task 7).
      # AUSENTE = 0 = DESLIGADO, o default e o que a spec C pede.
      AVANCO_AUTOMATICO_SEGUNDOS: ${AVANCO_AUTOMATICO_SEGUNDOS:-0}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      auth-users-service:
        condition: service_started

  chatbot-service:
    build:
      context: .
      dockerfile: chatbot-service/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8104:8000"
    environment:
      # O chatbot ganhou banco na fase 2 (módulo `support`). Antes destas
      # duas linhas serem preenchidas, elas eram zeradas de propósito, pelo
      # mesmo motivo do gateway: o `.env` compartilhado herdou a URL do
      # banco `edu` do legacy, e um serviço sem banco não pode herdá-la por
      # acidente. Continua sem publicar nem consumir eventos.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/chatbot_db
      DATABASE_URL_TEST: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/chatbot_test
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET não definido em back-end/.env}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      LEARNING_SERVICE_URL: http://learning-service:8000
    depends_on:
      learning-service:
        condition: service_started
      postgres:
        condition: service_healthy

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8105:8000"
    environment:
      <<: *service-env
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/notification_db
      DATABASE_URL_TEST: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/notification_test
    depends_on: *depends-db-mq

  analytics-service:
    build:
      context: .
      dockerfile: analytics-service/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8106:8000"
    environment:
      <<: *service-env
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/analytics_db
      DATABASE_URL_TEST: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/analytics_test
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    depends_on: *depends-db-mq

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
