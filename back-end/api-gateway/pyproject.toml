[project]
name = "api-gateway"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "granian>=1.6.0",
    "httpx>=0.28.0",
    "pydantic-settings>=2.6.0",
    "loguru>=0.7.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ASYNC"]

# `Depends(...)` como default de argumento é o idioma do FastAPI, não o
# bug que o B008 procura. Declarar aqui evita espalhar `# noqa: B008`
# por todo router do serviço.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Security",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# As duas linhas de loop_scope andam juntas. Só a de fixture não basta: o
# default de teste é "function", e uma fixture de escopo de sessão usada por
# um teste de escopo de função vive num loop diferente do teste — falha que
# só aparece quando o serviço ganha o seu segundo teste assíncrono sobre o
# mesmo recurso, não no primeiro.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: tests that load a real embeddings model (opt-in)",
]

[tool.coverage.run]
source = ["app"]
