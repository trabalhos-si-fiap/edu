<div class="backdrop" (mousedown)="onBackdrop($event)">
  <section class="modal">
    <header>
      <div>
        <span>OCORRÊNCIA #{{ occurrence.id }}</span>
        <h2>{{ carrierName }}</h2>
      </div>
      <button type="button" (click)="close()">×</button>
    </header>

    <div class="body">
      <div class="info-grid">
        <div>
          <span>TIPO</span>
          <strong>{{ typeLabel(occurrence.tipo) }}</strong>
        </div>
        <div>
          <span>STATUS</span>
          <strong>{{ occurrence.status }}</strong>
        </div>
        <div>
          <span>REGISTRADA EM</span>
          <strong>{{ formatDate(occurrence.criado_em) }}</strong>
        </div>
      </div>

      <div class="description">
        <span>MOTIVO</span>
        <p>{{ occurrence.motivo }}</p>
      </div>
    </div>

    <footer>
      <button class="cancel" type="button" (click)="close()">Fechar</button>
      @if (occurrence.status === 'ABERTA') {
        <button
          class="action"
          type="button"
          [disabled]="saving"
          (click)="resolve()"
        >
          {{ saving ? 'Salvando...' : 'Marcar como resolvida' }}
        </button>
      }
    </footer>
  </section>
</div>
